when:
  - event: ["push", "pull_request"]
    branch: ["main"]

engine: nixery

dependencies:
  nixpkgs:
    - shell
    - stdenv
    - findutils
    - binutils
    - libunwind
    - ncurses
    - opam
    - git
    - gawk
    - gnupatch
    - gnum4
    - gnumake
    - gnutar
    - gnused
    - gnugrep
    - diffutils
    - gzip
    - bzip2
    - gcc
    - ocaml
    - pkg-config

steps:
  - name: opam
    command: |
      opam init --disable-sandboxing -a -y

  - name: deps
    command: |
      opam install . --deps-only -y

  - name: build
    command: |
      opam exec -- dune build

  - name: deps-test
    command: |
      opam install . --deps-only --with-test -y

  - name: test
    command: |
      opam exec -- dune runtest --verbose

  - name: doc
    command: |
      opam install -y odoc
      opam exec -- dune build @doc
